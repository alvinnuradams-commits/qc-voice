<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QC Voice Iframe</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#e2e8f0;padding:16px}
.card{max-width:620px;margin:auto;background:#111827;border:1px solid #334155;border-radius:16px;padding:18px}
h2{margin:0 0 5px;font-size:20px}.sub{font-size:13px;color:#94a3b8;line-height:1.5}
.status{margin:14px 0;padding:10px 12px;border-radius:10px;background:#1e293b}
.status.ok{background:#052e1b;color:#86efac}.status.err{background:#450a0a;color:#fca5a5}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:700;font-size:17px;cursor:pointer}
button.stop{background:#dc2626}.send{margin-top:10px;background:#16a34a}.send:disabled{opacity:.4}
.text{margin-top:12px;min-height:90px;padding:14px;background:#0b1220;border-radius:12px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
<h2>🎙️ Voice QC</h2>
<div class="sub">Coba bicara: “Model X100 kanan scratch housing”</div>
<div id="status" class="status">READY</div>
<button id="btn" onclick="toggleVoice()">🎙️ Mulai Bicara</button>
<div id="text" class="text">Belum ada suara.</div>
<button id="send" class="send" onclick="sendResult()" disabled>↩️ Kirim ke Repair Man</button>
</div>
<script>
let rec=null,listening=false,finalText='';
const statusEl=document.getElementById('status'),btn=document.getElementById('btn'),textEl=document.getElementById('text'),send=document.getElementById('send');
function toggleVoice(){listening?stopVoice():startVoice();}
function startVoice(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){statusEl.textContent='Browser tidak mendukung Speech Recognition. Pakai Chrome.';statusEl.className='status err';return;}
 finalText='';send.disabled=true;textEl.textContent='🎙️ Mendengarkan...';
 rec=new SR();rec.lang='id-ID';rec.continuous=false;rec.interimResults=true;rec.maxAlternatives=3;
 rec.onstart=()=>{listening=true;btn.textContent='⏹️ Berhenti';btn.classList.add('stop');statusEl.textContent='LISTENING';statusEl.className='status ok';};
 rec.onresult=(e)=>{let interim='',final='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0]?.transcript||'';e.results[i].isFinal?final+=t:interim+=t;}if(final)finalText+=final;textEl.textContent=(finalText||interim||'').trim()||'🎙️ Mendengarkan...';if(finalText.trim())send.disabled=false;};
 rec.onerror=(e)=>{listening=false;btn.textContent='🎙️ Mulai Bicara';btn.classList.remove('stop');statusEl.textContent=(e.error==='not-allowed'||e.error==='service-not-allowed')?'Microphone ditolak. Izinkan microphone untuk domain Voice QC.':'Voice error: '+(e.error||'unknown');statusEl.className='status err';};
 rec.onend=()=>{listening=false;btn.textContent='🎙️ Mulai Bicara';btn.classList.remove('stop');if(finalText.trim()){textEl.textContent=finalText.trim();send.disabled=false;statusEl.textContent='SUDAH TERBACA';statusEl.className='status ok';}};
 try{rec.start();}catch(e){statusEl.textContent='Coba tekan lagi.';statusEl.className='status err';}
}
function stopVoice(){if(rec){try{rec.stop()}catch(e){}}listening=false;}
function sendResult(){const text=finalText.trim();if(!text)return;window.parent.postMessage({source:'QC_VOICE_IFRAME_V1',type:'QC_VOICE_RESULT',text:text},'*');statusEl.textContent='TERKIRIM KE REPAIR MAN';statusEl.className='status ok';send.disabled=true;}
</script>
</body></html>
